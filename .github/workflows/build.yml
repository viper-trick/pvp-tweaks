name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDKs (21 for 1.21.x, 25 for 26.x)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            21
            25

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build all version groups
        run: ./build-all.sh
        env:
          # Expose both installed JDKs to Gradle toolchain resolution
          # (1.21.x subprojects use Java 21, 26.x subprojects use Java 25)
          GRADLE_OPTS: -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: final-jars/*.jar
          if-no-files-found: error
